[project]
name = "protocolos-pcdt-mcp"
version = "0.1.0"
description = "Servidor MCP que consulta os PCDTs vigentes do Ministério da Saúde/Conitec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "duckdb>=1.1",
    "apscheduler>=3.10",
    "typer>=0.15",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.scripts]
protocolos-pcdt-mcp = "protocolos_pcdt_mcp.mcp_server.server:main"
pcdt-cli = "protocolos_pcdt_mcp.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocolos_pcdt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/protocolos_pcdt_mcp/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pdfplumber.*", "bs4.*"]
ignore_missing_imports = true
